[project]
name = "task-nudge-voice-bot"
version = "0.1.0"
description = "Voice-based task assistant with TickTick integration"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai[realtime]>=1.30,<2",
    "httpx>=0.25,<1",
    "ticktick-sdk>=0.4,<1",
    "pyaudio>=0.2.14,<1",
    "speexdsp>=0.1,<1",
    "openwakeword>=0.6,<1",
    "onnxruntime>=1.16,<2",
    "keyboard>=0.13,<1",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
task-nudge-voice = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
